name: Temporary build check
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install dependencies
        run: bundle install
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl /LJT-Homepage
      - name: List generated pages
        run: |
          ls _site
          ls _site/publications | head -50
